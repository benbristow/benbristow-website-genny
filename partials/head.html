<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="Ben Bristow, software engineer, developer, Cleethorpes, England">
    <meta name="author" content="Ben Bristow">
    <meta name="robots" content="index, follow">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ permalink }}">
    <meta property="og:title" content="{{ title }} | {{ site.name }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:site_name" content="Ben Bristow">
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ permalink }}">
    <meta property="twitter:title" content="{{ title }} | {{ site.name }}">
    <meta property="twitter:description" content="{{ site.description }}">
    <link rel="dns-prefetch" href="//um.s.bristow.me">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="canonical" href="{{ permalink }}">
    <title>{{ title }} | {{ site.name }}</title>
    <link rel="stylesheet" href="/main.css?{{ epoch }}" />
</head>
