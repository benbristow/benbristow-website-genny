name: Build with Genny
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm install

      - name: Build with npm
        run: npm run build

      - name: Build site with Genny
        uses: benbristow/genny-action@v1